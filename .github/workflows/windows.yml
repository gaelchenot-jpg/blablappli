name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voix:
    # phrases françaises enregistrées par une voix de synthèse, pour l'essai complet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phrases d'essai
        run: |
          pip install piper-tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium
          curl -sSfL -o voix.onnx $base/fr_FR-siwis-medium.onnx
          curl -sSfL -o voix.onnx.json $base/fr_FR-siwis-medium.onnx.json
          python windows/tests/make_audio.py voix.onnx phrases
      - uses: actions/upload-artifact@v4
        with:
          name: phrases
          path: phrases

  build:
    needs: voix
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Composants
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Correcteur Grammalecte
        run: |
          Invoke-WebRequest -Uri "https://grammalecte.net/zip/Grammalecte-fr-v2.1.1.zip" -OutFile g.zip
          Expand-Archive g.zip -DestinationPath g -Force
          $setup = Get-ChildItem -Path g -Recurse -Filter setup.py | Select-Object -First 1
          pip install $setup.DirectoryName

      - name: Thésaurus (LibreOffice)
        run: |
          $headers = @{ Authorization = "Bearer ${{ github.token }}" }
          $liste = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/LibreOffice/dictionaries/contents/fr_FR/dictionaries"
          $nom = ($liste | Where-Object { $_.name -like "thes*.dat" } | Select-Object -First 1).name
          Write-Host "Thésaurus : $nom"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/fr_FR/dictionaries/$nom" -OutFile data\thes_fr.dat

      - name: Tests
        run: python -m pytest -q tests

      - name: Fabrication de blablappli.exe
        run: |
          pyinstaller --noconfirm --clean --windowed --name blablappli `
            --icon data\blablappli.ico `
            --add-data "data;data" `
            --collect-all grammalecte `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all onnxruntime `
            --collect-data spellchecker `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            run_blablappli.py

      - name: Vérification de l'exe
        run: |
          $p = Start-Process -FilePath dist\blablappli\blablappli.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Vérification échouée (code $($p.ExitCode))" }

      - uses: actions/download-artifact@v4
        with:
          name: phrases
          path: windows/phrases

      - name: Programme d'installation
        run: |
          $env:BLABLAPPLI_VERSION = "0.1.${{ github.run_number }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc blablappli.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
          Get-ChildItem dist\*.exe

      - name: Installation (comme sur un vrai PC)
        run: |
          $p = Start-Process -FilePath dist\blablappli-installation.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation échouée (code $($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\blablappli\blablappli.exe"
          if (-not (Test-Path $exe)) { throw "blablappli.exe absent après installation" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "blablappli.lnk"
          if (-not (Test-Path $lnk)) { throw "Raccourci du Bureau absent" }
          Write-Host "Installé : $exe, raccourci : $lnk"

      - name: Essai complet (dictée dans le Bloc-notes)
        timeout-minutes: 40
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\blablappli\blablappli.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--e2e", "$PWD\e2e.txt", "$PWD\phrases" -Wait -PassThru
          Get-Content e2e.txt
          if ($p.ExitCode -ne 0) { throw "Essai complet échoué (code $($p.ExitCode))" }

      - name: Désinstallation
        run: |
          $u = "$env:LOCALAPPDATA\Programs\blablappli\unins000.exe"
          $p = Start-Process -FilePath $u -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$env:LOCALAPPDATA\Programs\blablappli\blablappli.exe") { throw "Désinstallation incomplète" }
          Write-Host "Désinstallé proprement"

      - uses: actions/upload-artifact@v4
        with:
          name: blablappli-windows
          path: windows/dist/blablappli-installation.exe

      - name: Publier (lien de téléchargement)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: blablappli Windows (dernière version)
          make_latest: false
          body: |
            Télécharge **blablappli-installation.exe**, double-clique dessus et suis les étapes.
            Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.
            Version 0.1.${{ github.run_number }}.
          files: windows/dist/blablappli-installation.exe
